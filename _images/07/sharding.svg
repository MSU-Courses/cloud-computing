<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1060 470' width='1060' height='470' role='img' aria-label='Sharding the orders table by hash of customer_id'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#232F3E' stroke-width='1.5'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#D13212' stroke-width='1.5'/></marker></defs><rect width='1060' height='470' fill='#ffffff'/><image href='data:image/svg+xml;base64,' x='506.0' y='20' width='48' height='48'/><text x='530' y='84' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>Приложение</text><rect x='395' y='110' width='270' height='34' rx='0' fill='#F2F3F3' stroke='#232F3E' stroke-width='1.5'/><text x='530' y='132' font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size='13' fill='#232F3E' text-anchor='middle' font-weight='400'>шард = hash(customer_id) mod 3</text><image href='data:image/svg+xml;base64,' x='166.0' y='250' width='48' height='48'/><text x='190' y='314' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>Шард 0</text><rect x='95' y='335' width='190' height='50' rx='0' fill='#ffffff' stroke='#AAB7B8' stroke-width='1'/><text x='190' y='355' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#232F3E' text-anchor='middle' font-weight='400'>клиенты 17, 55, 91</text><text x='190' y='372' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#545B64' text-anchor='middle' font-weight='400'>их заказы</text><image href='data:image/svg+xml;base64,' x='506.0' y='250' width='48' height='48'/><text x='530' y='314' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>Шард 1</text><rect x='435' y='335' width='190' height='50' rx='0' fill='#ffffff' stroke='#AAB7B8' stroke-width='1'/><text x='530' y='355' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#232F3E' text-anchor='middle' font-weight='400'>клиенты 42, 73, 88</text><text x='530' y='372' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#545B64' text-anchor='middle' font-weight='400'>их заказы</text><image href='data:image/svg+xml;base64,' x='846.0' y='250' width='48' height='48'/><text x='870' y='314' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>Шард 2</text><rect x='775' y='335' width='190' height='50' rx='0' fill='#ffffff' stroke='#AAB7B8' stroke-width='1'/><text x='870' y='355' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#232F3E' text-anchor='middle' font-weight='400'>клиенты 5, 29, 64</text><text x='870' y='372' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#545B64' text-anchor='middle' font-weight='400'>их заказы</text><polyline points='530,144 530,244' fill='none' stroke='#00A4A6' stroke-width='2' marker-end='url(#ah)'/><text x='540' y='200' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#00A4A6' text-anchor='start' font-weight='700'>заказы клиента 42</text><text x='540' y='215' font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size='11' fill='#00A4A6' text-anchor='start' font-weight='400'>hash(42) mod 3 = 1</text><polyline points='410,144 410,180 190,180 190,244' fill='none' stroke='#232F3E' stroke-width='1.5' stroke-dasharray='6 4' marker-end='url(#ah)'/><polyline points='650,144 650,180 870,180 870,244' fill='none' stroke='#232F3E' stroke-width='1.5' stroke-dasharray='6 4' marker-end='url(#ah)'/><polyline points='505,144 505,244' fill='none' stroke='#232F3E' stroke-width='1.5' stroke-dasharray='6 4' marker-end='url(#ah)'/><text x='300' y='168' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#232F3E' text-anchor='middle' font-weight='400'>выручка за день: запрос во все шарды</text><text x='530' y='425' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>Сплошная стрелка: запрос по ключу шарда идёт в один шард.</text><text x='530' y='445' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>Пунктир: запрос без ключа шарда приходится отправлять во все шарды.</text></svg>