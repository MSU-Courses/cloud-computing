<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 430' width='1100' height='430' role='img' aria-label='Synchronous and asynchronous replication'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#232F3E' stroke-width='1.5'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#D13212' stroke-width='1.5'/></marker></defs><rect width='1100' height='430' fill='#ffffff'/><text x='270' y='30' font-family="Arial, Helvetica, sans-serif" font-size='17' fill='#232F3E' text-anchor='middle' font-weight='700'>Синхронная репликация</text><rect x='10.0' y='50' width='140' height='44' rx='6' fill='#F2F3F3' stroke='#232F3E' stroke-width='1.5'/><text x='80' y='77.0' font-family="Arial, Helvetica, sans-serif" font-size='14' fill='#232F3E' text-anchor='middle' font-weight='700'>Приложение</text><line x1='80' y1='94' x2='80' y2='330' stroke='#AAB7B8' stroke-width='1.5' stroke-dasharray='5 5'/><rect x='200.0' y='50' width='140' height='44' rx='6' fill='#F2F3F3' stroke='#232F3E' stroke-width='1.5'/><text x='270' y='77.0' font-family="Arial, Helvetica, sans-serif" font-size='14' fill='#232F3E' text-anchor='middle' font-weight='700'>Основной</text><line x1='270' y1='94' x2='270' y2='330' stroke='#AAB7B8' stroke-width='1.5' stroke-dasharray='5 5'/><rect x='390.0' y='50' width='140' height='44' rx='6' fill='#F2F3F3' stroke='#232F3E' stroke-width='1.5'/><text x='460' y='77.0' font-family="Arial, Helvetica, sans-serif" font-size='14' fill='#232F3E' text-anchor='middle' font-weight='700'>Реплика</text><line x1='460' y1='94' x2='460' y2='330' stroke='#AAB7B8' stroke-width='1.5' stroke-dasharray='5 5'/><text x='830' y='30' font-family="Arial, Helvetica, sans-serif" font-size='17' fill='#232F3E' text-anchor='middle' font-weight='700'>Асинхронная репликация</text><rect x='570.0' y='50' width='140' height='44' rx='6' fill='#F2F3F3' stroke='#232F3E' stroke-width='1.5'/><text x='640' y='77.0' font-family="Arial, Helvetica, sans-serif" font-size='14' fill='#232F3E' text-anchor='middle' font-weight='700'>Приложение</text><line x1='640' y1='94' x2='640' y2='330' stroke='#AAB7B8' stroke-width='1.5' stroke-dasharray='5 5'/><rect x='760.0' y='50' width='140' height='44' rx='6' fill='#F2F3F3' stroke='#232F3E' stroke-width='1.5'/><text x='830' y='77.0' font-family="Arial, Helvetica, sans-serif" font-size='14' fill='#232F3E' text-anchor='middle' font-weight='700'>Основной</text><line x1='830' y1='94' x2='830' y2='330' stroke='#AAB7B8' stroke-width='1.5' stroke-dasharray='5 5'/><rect x='950.0' y='50' width='140' height='44' rx='6' fill='#F2F3F3' stroke='#232F3E' stroke-width='1.5'/><text x='1020' y='77.0' font-family="Arial, Helvetica, sans-serif" font-size='14' fill='#232F3E' text-anchor='middle' font-weight='700'>Реплика</text><line x1='1020' y1='94' x2='1020' y2='330' stroke='#AAB7B8' stroke-width='1.5' stroke-dasharray='5 5'/><polyline points='80,135 266,135' fill='none' stroke='#232F3E' stroke-width='2' marker-end='url(#ah)'/><text x='173.0' y='127' font-family="Arial, Helvetica, sans-serif" font-size='13' fill='#232F3E' text-anchor='middle' font-weight='400'>1. запись</text><polyline points='270,185 456,185' fill='none' stroke='#232F3E' stroke-width='2' marker-end='url(#ah)'/><text x='363.0' y='177' font-family="Arial, Helvetica, sans-serif" font-size='13' fill='#232F3E' text-anchor='middle' font-weight='400'>2. копия изменений</text><polyline points='460,235 274,235' fill='none' stroke='#232F3E' stroke-width='2' marker-end='url(#ah)'/><text x='367.0' y='227' font-family="Arial, Helvetica, sans-serif" font-size='13' fill='#232F3E' text-anchor='middle' font-weight='400'>3. получено</text><polyline points='270,285 84,285' fill='none' stroke='#00A4A6' stroke-width='2' marker-end='url(#ah)'/><text x='177.0' y='277' font-family="Arial, Helvetica, sans-serif" font-size='13' fill='#00A4A6' text-anchor='middle' font-weight='400'>4. OK</text><text x='270' y='380' font-family="Arial, Helvetica, sans-serif" font-size='13' fill='#232F3E' text-anchor='middle' font-weight='400'>OK приходит только после ответа реплики:</text><text x='270' y='400' font-family="Arial, Helvetica, sans-serif" font-size='13' fill='#232F3E' text-anchor='middle' font-weight='400'>запись медленнее, данные не теряются</text><polyline points='640,135 826,135' fill='none' stroke='#232F3E' stroke-width='2' marker-end='url(#ah)'/><text x='733.0' y='127' font-family="Arial, Helvetica, sans-serif" font-size='13' fill='#232F3E' text-anchor='middle' font-weight='400'>1. запись</text><polyline points='830,185 644,185' fill='none' stroke='#00A4A6' stroke-width='2' marker-end='url(#ah)'/><text x='737.0' y='177' font-family="Arial, Helvetica, sans-serif" font-size='13' fill='#00A4A6' text-anchor='middle' font-weight='400'>2. OK</text><rect x='838' y='200' width='174' height='70' fill='#FDEDEC' stroke='#D13212' stroke-dasharray='4 3' rx='6'/><text x='925.0' y='228' font-family="Arial, Helvetica, sans-serif" font-size='13' fill='#D13212' text-anchor='middle' font-weight='700'>отказ здесь: запись потеряна</text><text x='925.0' y='250' font-family="Arial, Helvetica, sans-serif" font-size='13' fill='#D13212' text-anchor='middle' font-weight='400'>это окно и определяет RPO</text><polyline points='830,300 1016,300' fill='none' stroke='#232F3E' stroke-width='2' stroke-dasharray='7 5' marker-end='url(#ah)'/><text x='923.0' y='292' font-family="Arial, Helvetica, sans-serif" font-size='13' fill='#232F3E' text-anchor='middle' font-weight='400'>3. копия изменений (позже)</text><text x='830' y='380' font-family="Arial, Helvetica, sans-serif" font-size='13' fill='#232F3E' text-anchor='middle' font-weight='400'>OK приходит сразу:</text><text x='830' y='400' font-family="Arial, Helvetica, sans-serif" font-size='13' fill='#232F3E' text-anchor='middle' font-weight='400'>запись быстрее, но последние изменения можно потерять</text></svg>