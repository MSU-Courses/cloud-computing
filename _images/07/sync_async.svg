<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1120 520' width='1120' height='520' role='img' aria-label='Synchronous and asynchronous replication timelines'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#232F3E' stroke-width='1.5'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#D13212' stroke-width='1.5'/></marker></defs><rect width='1120' height='520' fill='#ffffff'/><text x='280' y='28' font-family="Arial, Helvetica, sans-serif" font-size='15' fill='#232F3E' text-anchor='middle' font-weight='700'>Синхронная репликация</text><text x='840' y='28' font-family="Arial, Helvetica, sans-serif" font-size='15' fill='#232F3E' text-anchor='middle' font-weight='700'>Асинхронная репликация</text><rect x='28' y='50' width='124' height='30' rx='0' fill='#F2F3F3' stroke='#232F3E' stroke-width='1.5'/><text x='90' y='70' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='700'>Приложение</text><line x1='90' y1='80' x2='90' y2='470' stroke='#545B64' stroke-width='1' stroke-dasharray='4 4'/><rect x='218' y='50' width='124' height='30' rx='0' fill='#F2F3F3' stroke='#232F3E' stroke-width='1.5'/><text x='280' y='70' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='700'>Основной</text><line x1='280' y1='80' x2='280' y2='470' stroke='#545B64' stroke-width='1' stroke-dasharray='4 4'/><rect x='408' y='50' width='124' height='30' rx='0' fill='#F2F3F3' stroke='#232F3E' stroke-width='1.5'/><text x='470' y='70' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='700'>Реплика</text><line x1='470' y1='80' x2='470' y2='470' stroke='#545B64' stroke-width='1' stroke-dasharray='4 4'/><polyline points='90,120 280,120' fill='none' stroke='#232F3E' stroke-width='1.5' marker-end='url(#ah)'/><text x='185.0' y='113' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#232F3E' text-anchor='middle' font-weight='400'>1. транзакция</text><text x='288' y='152' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#545B64' text-anchor='start' font-weight='400'>2. запись в журнал</text><polyline points='280,190 470,190' fill='none' stroke='#232F3E' stroke-width='1.5' marker-end='url(#ah)'/><text x='375.0' y='183' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#232F3E' text-anchor='middle' font-weight='400'>3. изменения</text><polyline points='470,240 280,240' fill='none' stroke='#232F3E' stroke-width='1.5' marker-end='url(#ah)'/><text x='375.0' y='233' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#232F3E' text-anchor='middle' font-weight='400'>4. получено</text><polyline points='280,290 90,290' fill='none' stroke='#232F3E' stroke-width='1.5' marker-end='url(#ah)'/><text x='185.0' y='283' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#232F3E' text-anchor='middle' font-weight='400'>5. OK</text><rect x='83' y='120' width='14' height='170' fill='#FDEBD0' stroke='#E07B00'/><text x='76' y='210' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#E07B00' text-anchor='end' font-weight='400'>ждёт</text><text x='370' y='400' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>Приложение получает OK, когда изменения</text><text x='370' y='418' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>уже есть на реплике. Запись медленнее,</text><text x='370' y='436' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>зато при отказе ничего не теряется.</text><rect x='588' y='50' width='124' height='30' rx='0' fill='#F2F3F3' stroke='#232F3E' stroke-width='1.5'/><text x='650' y='70' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='700'>Приложение</text><line x1='650' y1='80' x2='650' y2='470' stroke='#545B64' stroke-width='1' stroke-dasharray='4 4'/><rect x='778' y='50' width='124' height='30' rx='0' fill='#F2F3F3' stroke='#232F3E' stroke-width='1.5'/><text x='840' y='70' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='700'>Основной</text><line x1='840' y1='80' x2='840' y2='470' stroke='#545B64' stroke-width='1' stroke-dasharray='4 4'/><rect x='968' y='50' width='124' height='30' rx='0' fill='#F2F3F3' stroke='#232F3E' stroke-width='1.5'/><text x='1030' y='70' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='700'>Реплика</text><line x1='1030' y1='80' x2='1030' y2='470' stroke='#545B64' stroke-width='1' stroke-dasharray='4 4'/><polyline points='650,120 840,120' fill='none' stroke='#232F3E' stroke-width='1.5' marker-end='url(#ah)'/><text x='745.0' y='113' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#232F3E' text-anchor='middle' font-weight='400'>1. транзакция</text><text x='848' y='152' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#545B64' text-anchor='start' font-weight='400'>2. запись в журнал</text><polyline points='840,190 650,190' fill='none' stroke='#232F3E' stroke-width='1.5' marker-end='url(#ah)'/><text x='745.0' y='183' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#232F3E' text-anchor='middle' font-weight='400'>3. OK</text><polyline points='840,320 1030,320' fill='none' stroke='#232F3E' stroke-width='1.5' stroke-dasharray='6 4' marker-end='url(#ah)'/><text x='935.0' y='313' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#232F3E' text-anchor='middle' font-weight='400'>4. изменения</text><rect x='844' y='196' width='182' height='100' fill='#FDEDEC' stroke='#D13212' stroke-dasharray='4 3'/><text x='941.0' y='218' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#D13212' text-anchor='middle' font-weight='700'>окно потери данных = RPO</text><line x1='830' y1='235' x2='850' y2='255' stroke='#D13212' stroke-width='3'/><line x1='830' y1='255' x2='850' y2='235' stroke='#D13212' stroke-width='3'/><text x='945.0' y='245' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#D13212' text-anchor='middle' font-weight='400'>если основной сервер</text><text x='945.0' y='260' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#D13212' text-anchor='middle' font-weight='400'>откажет здесь,</text><text x='945.0' y='275' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#D13212' text-anchor='middle' font-weight='400'>транзакция 1 потеряна</text><text x='840' y='400' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>Приложение получает OK сразу. Запись быстрее,</text><text x='840' y='418' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>но изменения, не дошедшие до реплики,</text><text x='840' y='436' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>при отказе основного сервера теряются.</text></svg>