<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 400' width='900' height='400' role='img' aria-label='Vertical scaling replaces a server with a bigger one, horizontal scaling adds servers behind one entry point'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#232F3E' stroke-width='1.5'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#D13212' stroke-width='1.5'/></marker><marker id='aht' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#00A4A6' stroke-width='1.5'/></marker><marker id='aho' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#ED7100' stroke-width='1.5'/></marker></defs><rect width='900' height='400' fill='#ffffff'/><text x='220' y='30' font-family="Arial, Helvetica, sans-serif" font-size='14' fill='#232F3E' text-anchor='middle' font-weight='700'>Вертикальное масштабирование</text><text x='660' y='30' font-family="Arial, Helvetica, sans-serif" font-size='14' fill='#232F3E' text-anchor='middle' font-weight='700'>Горизонтальное масштабирование</text><polyline points='440,50 440,380' fill='none' stroke='#D5DBDB' stroke-width='1.5'/><image href='data:image/svg+xml;base64,' x='66' y='120' width='48' height='48'/><text x='90.0' y='184' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>t3.micro</text><text x='90.0' y='199' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#545B64' text-anchor='middle' font-weight='400'>2 vCPU, 1 ГиБ</text><image href='data:image/svg+xml;base64,' x='268' y='96' width='96' height='96'/><text x='316.0' y='208' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>t3.xlarge</text><text x='316.0' y='223' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#545B64' text-anchor='middle' font-weight='400'>4 vCPU, 16 ГиБ</text><polyline points='130,144 250,144' fill='none' stroke='#232F3E' stroke-width='1.5' marker-end='url(#ah)'/><text x='190' y='130' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#545B64' text-anchor='middle' font-weight='400'>остановка,</text><text x='190' y='160' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#545B64' text-anchor='middle' font-weight='400'>смена типа</text><text x='220' y='290' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#545B64' text-anchor='middle' font-weight='400'>Тот же сервер, но мощнее.</text><text x='220' y='307' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#545B64' text-anchor='middle' font-weight='400'>Одна точка отказа остаётся.</text><image href='data:image/svg+xml;base64,' x='636' y='50' width='48' height='48'/><rect x='590' y='120' width='140' height='40' rx='4' fill='#ffffff' stroke='#232F3E' stroke-width='1.5'/><text x='660.0' y='144.0' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>Общая точка входа</text><polyline points='660,100 660,118' fill='none' stroke='#232F3E' stroke-width='1.5' marker-end='url(#ah)'/><image href='data:image/svg+xml;base64,' x='521' y='220' width='48' height='48'/><text x='545.0' y='284' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>Сервер 1</text><polyline points='660,160 545,214' fill='none' stroke='#232F3E' stroke-width='1.5' marker-end='url(#ah)'/><image href='data:image/svg+xml;base64,' x='611' y='220' width='48' height='48'/><text x='635.0' y='284' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>Сервер 2</text><polyline points='660,160 635,214' fill='none' stroke='#232F3E' stroke-width='1.5' marker-end='url(#ah)'/><image href='data:image/svg+xml;base64,' x='701' y='220' width='48' height='48'/><text x='725.0' y='284' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>Сервер 3</text><rect x='695' y='214' width='60' height='60' rx='4' fill='none' stroke='#ED7100' stroke-width='1.5' stroke-dasharray='5 3'/><polyline points='660,160 725,214' fill='none' stroke='#ED7100' stroke-width='1.5' stroke-dasharray='5 3' marker-end='url(#aho)'/><image href='data:image/svg+xml;base64,' x='791' y='220' width='48' height='48'/><text x='815.0' y='284' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>Сервер 4</text><rect x='785' y='214' width='60' height='60' rx='4' fill='none' stroke='#ED7100' stroke-width='1.5' stroke-dasharray='5 3'/><polyline points='660,160 815,214' fill='none' stroke='#ED7100' stroke-width='1.5' stroke-dasharray='5 3' marker-end='url(#aho)'/><text x='840' y='330' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#ED7100' text-anchor='end' font-weight='400'>scale out: добавить</text><text x='840' y='346' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#ED7100' text-anchor='end' font-weight='400'>scale in: убрать</text><text x='660' y='380' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#545B64' text-anchor='middle' font-weight='400'>Одинаковые серверы делят нагрузку.</text></svg>