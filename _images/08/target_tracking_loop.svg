hor='start' font-weight='400'>направляет им запросы,</text><text x='120' y='382' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#545B64' text-anchor='start' font-weight='400'>нагрузка снижается</text><polyline points='290,100.0 371,100.0' fill='none' stroke='#ED7100' stroke-width='2' marker-end='url(#aho)'/><polyline points='625,100.0 706,100.0' fill='none' stroke='#ED7100' stroke-width='2' marker-end='url(#aho)'/><polyline points='835.0,160 835.0,296' fill='none' stroke='#ED7100' stroke-width='2' marker-end='url(#aho)'/><polyline points='710,360.0 629,360.0' fill='none' stroke='#ED7100' stroke-width='2' marker-end='url(#aho)'/><polyline points='375,360.0 294,360.0' fill='none' stroke='#ED7100' stroke-width='2' marker-end='url(#aho)'/><polyline points='165.0,300 165.0,164' fill='none' stroke='#ED7100' stroke-width='2' stroke-dasharray='6 4' marker-end='url(#aho)'/><text x='177.0' y='234.0' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#ED7100' text-anchor='start' font-weight='400'>новые метрики</text><rect x='395' y='205' width='210' height='52' rx='6' fill='#ffffff' stroke='#ED7100' stroke-width='1.5'/><text x='500.0' y='227.5' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#ED7100' text-anchor='middle' font-weight='400'>Цель политики:</text><text x='500.0' y='242.5' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#ED7100' text-anchor='middle' font-weight='400'>средняя загрузка CPU 50%</text><text x='500' y='455' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#545B64' text-anchor='middle' font-weight='400'>Цикл останавливается, когда метрика возвращается к целевому значению</text></svg>