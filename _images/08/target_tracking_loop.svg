<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 470' width='1000' height='470' role='img' aria-label='Target tracking loop in six steps: metrics, alarm, desired capacity, new instances, target group, balancer'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#232F3E' stroke-width='1.5'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#D13212' stroke-width='1.5'/></marker><marker id='aht' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#00A4A6' stroke-width='1.5'/></marker><marker id='aho' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#ED7100' stroke-width='1.5'/></marker><marker id='ahp' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#8C4FFF' stroke-width='1.5'/></marker><marker id='ahg' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#7AA116' stroke-width='1.5'/></marker></defs><rect width='1000' height='470' fill='#ffffff'/><rect x='40' y='40' width='250' height='120' rx='8' fill='#ffffff' stroke='#AAB7B8' stroke-width='1.5'/><circle cx='40' cy='40' r='15' fill='#ED7100'/><text x='40' y='45' font-family="Arial, Helvetica, sans-serif" font-size='14' fill='#ffffff' text-anchor='middle' font-weight='700'>1</text><image href='data:image/svg+xml;base64,' x='58' y='76' width='48' height='48'/><text x='120' y='86' font-family="Arial, Helvetica, sans-serif" font-size='13' fill='#232F3E' text-anchor='start' font-weight='700'>CloudWatch</