-family="Arial, Helvetica, sans-serif" font-size='14' fill='#232F3E' text-anchor='middle' font-weight='700'>Результат</text><image href='data:image/svg+xml;base64,' x='106.0' y='66.0' width='48' height='48'/><text x='130' y='130.0' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>HTTP-запрос</text><image href='data:image/svg+xml;base64,' x='106.0' y='176.0' width='48' height='48'/><text x='130' y='240.0' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>Загрузка файла в S3</text><image href='data:image/svg+xml;base64,' x='106.0' y='286.0' width='48' height='48'/><text x='130' y='350.0' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>Сообщение в очереди</text><image href='data:image/svg+xml;base64,' x='448.0' y='168.0' width='64' height='64'/><text x='480' y='248.0' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>Функция Lambda</text><text x='480' y='263.0' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#545B64' text-anchor='middle' font-weight='400'>handler(event, context)</text><polyline points='180,90 430,172.5' fill='none' stroke='#232F3E' stroke-width='1.5' marker-end='url(#ah)'/><polyline points='180,200 430,200.0' fill='none' stroke='#232F3E' stroke-width='1.5' marker-end='url(#ah)'/><polyline points='180,310 430,227.5' fill='none' stroke='#232F3E' stroke-width='1.5' marker-end='url(#ah)'/><text x='300' y='128' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#545B64' text-anchor='middle' font-weight='400'>событие (JSON)</text><image href='data:image/svg+xml;base64,' x='806.0' y='96.0' width='48' height='48'/><text x='830' y='160.0' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>Результат в хранилище</text><text x='8