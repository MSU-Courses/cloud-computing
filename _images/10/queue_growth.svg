' fill='#545B64' text-anchor='end' font-weight='400'>4 800</text><polyline points='110,91.19999999999999 930,91.19999999999999' fill='none' stroke='#EAEDED' stroke-width='1' stroke-dasharray='6 4'/><text x='520.0' y='408' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' font-weight='400'>Время с начала распродажи, минуты</text><text x='30' y='220.0' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='middle' transform='rotate(-90 30 220.0)'>Сообщений в очереди</text><polygon points='110.0,360 274.0,91.19999999999999 930.0,360' fill='#FFF4E8' stroke='none'/><polyline points='110.0,360 274.0,91.19999999999999' fill='none' stroke='#ED7100' stroke-width='2.5'/><polyline points='274.0,91.19999999999999 930.0,360' fill='none' stroke='#00A4A6' stroke-width='2.5'/><polyline points='274.0,91.19999999999999 274.0,360' fill='none' stroke='#545B64' stroke-width='1' stroke-dasharray='6 4'/><text x='282.0' y='81.19999999999999' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#232F3E' text-anchor='start' font-weight='700'>конец распродажи: 4 800 сообщений</text><text x='405.2' y='276.0' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#ED7100' text-anchor='middle' font-weight='400'>0-2 минуты: приходит 50 в секунду,</text><text x='405.2' y='291.0' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#ED7100' text-anchor='middle' font-weight='400'>уходит 10 в секунду, очередь растёт</text><text x='405.2' y='306.0' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#ED7100' text-anchor='middle' font-weight='400'>на 40 сообщений в секунду</text><text x='708.6' y='152.8' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#00A4A6' text-anchor='middle' font-weight='400'>после распродажи новых заказов нет,</text><text x='708.6' y='167.8' font-family="Arial, Helvetica, sans-serif" font-size='11' fill='#00A4A6' text-anchor='middle' font-weight='