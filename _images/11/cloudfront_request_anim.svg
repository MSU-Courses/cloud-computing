ty:0}62.31%,95.38%{opacity:1}100%{opacity:0}}.a8{animation:k8 13.0s linear infinite}@keyframes k9{0%,60.00%{opacity:0;transform:translate(122px,300px)}60.62%{opacity:1;transform:translate(122px,300px)}67.50%{opacity:1;transform:translate(328px,205px)}74.38%{opacity:1;transform:translate(122px,300px)}76.31%,100%{opacity:0;transform:translate(122px,300px)}}.a9{animation:k9 13.0s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width='1100' height='400' fill='#ffffff'/><image href='data:image/svg+xml;base64,' x='66.0' y='86.0' width='48' height='48'/><text x='90' y='152.0' font-family="Arial, Helvetica, sans-serif" font-size='14' fill='#232F3E' text-anchor='middle' font-weight='700'>Пользователь 1</text><image href='data:image/svg+xml;base64,' x='66.0' y='276.0' width='48' height='48'/><text x='90' y='342.0' font-family="Arial, Helvetica, sans-serif" font-size='14' fill='#232F3E' text-anchor='middle' font-weight='700'>Пользователь 2</text><text x='90' y='360.0' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#545B64' text-anchor='middle'>рядом с первым</text><image href='data:image/svg+xml;base64,' x='336.0' y='166.0' width='48' height='48'/><text x='360' y='232.0' font-family="Arial, Helvetica, sans-serif" font-size='14' fill='#232F3E' text-anchor='middle' font-weight='700'>Точка присутствия</text><text x='360' y='250.0' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#545B64' text-anchor='middle'>(PoP), ближайшая</text><image href='data:image/svg+xml;base64,' x='586.0' y='166.0' width='48' height='48'/><text x='610' y='232.0' font-family="Arial, Helvetica, sans-serif" font-size='14' fill='#232F3E' text-anchor='middle' font-weight='700'>Региональный кэш</text><text x='610' y='250.0' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#545B64' text-anchor='middle'>общий для группы</text><text x='610' y='266.0' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#545B64' text-anchor='middle'>точек присутствия</text><rect x='780' y='80' width='300' height='230' rx='0' fill='none' stroke='#232F3E' stroke-width='1.5'/><text x='790' y='100' font-family="Arial, Helvetica, sans-serif" font-size='13' fill='#232F3E' text-anchor='start' font-weight='700'>Регион eu-central-1</text><image href='data:image/svg+xml;base64,' x='906.0' y='166.0' width='48' height='48'/><text x='930' y='232.0' font-family="Arial, Helvetica, sans-serif" font-size='14' fill='#232F3E' text-anchor='middle' font-weight='700'>Бакет S3</text><text x='930' y='250.0' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#545B64' text-anchor='middle'>источник</text><g class='a0'><line x1='122' y1='118' x2='328' y2='182' stroke='#D13212' stroke-width='2' marker-end='url(#m_red)'/><text x='215' y='135' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#D13212' text-anchor='middle'>1. промах</text></g><circle class='a1' r='7' fill='#D13212' stroke='#ffffff' stroke-width='2' opacity='0'/><g class='a2'><line x1='392' y1='190' x2='578' y2='190' stroke='#D13212' stroke-width='2' marker-end='url(#m_red)'/><text x='485.0' y='180' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#D13212' text-anchor='middle'>2. промах</text></g><circle class='a3' r='7' fill='#D13212' stroke='#ffffff' stroke-width='2' opacity='0'/><g class='a4'><line x1='642' y1='190' x2='898' y2='190' stroke='#D13212' stroke-width='2' marker-end='url(#m_red)'/><text x='711' y='180' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#D13212' text-anchor='middle'>3. запрос в источник</text></g><circle class='a5' r='7' fill='#D13212' stroke='#ffffff' stroke-width='2' opacity='0'/><g class='a6'><polyline points='930,262 930,350 360,350 360,262' fill='none' stroke='#D13212' stroke-width='2' stroke-dasharray='6 4' marker-end='url(#m_red)'/><text x='645' y='372' font-family="Arial, Helvetica, sans-serif" font-size='12' fill='#D13212' text-anchor='middle'>4. ответ сохран