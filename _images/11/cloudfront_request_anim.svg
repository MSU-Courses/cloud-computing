<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 400' width='1100' height='400' role='img' aria-label='How CloudFront serves a request: the first request misses at the point of presence and the regional edge cache and reaches the S3 origin, the second request nearby is a hit at the point of presence'><defs><marker id='m_ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#232F3E' stroke-width='1.5'/></marker><marker id='m_red' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#D13212' stroke-width='1.5'/></marker><marker id='m_green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#7AA116' stroke-width='1.5'/></marker><marker id='m_teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#00A4A6' stroke-width='1.5'/></marker><marker id='m_orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#ED7100' stroke-width='1.5'/></marker><marker id='m_pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#E7157B' stroke-width='1.5'/></marker><marker id='m_grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#545B64' stroke-width='1.5'/></marker><marker id='m_light' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#8C949E' stroke-width='1.5'/></marker><marker id='m_purple' viewBox='0 0 10 10' refX='9