<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 470' width='1100' height='470' role='img' aria-label='Build cache: slow Dockerfile rebuilds npm ci after a code change, fast Dockerfile keeps the dependency layer cached'><defs><marker id='m_ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#232F3E' stroke-width='1.5'/></marker><marker id='m_grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#545B64' stroke-width='1.5'/></marker><marker id='m_orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#ED7100' stroke-width='1.5'/></marker><marker id='m_red' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#D13212' stroke-width='1.5'/></marker><marker id='m_teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#00A4A6' stroke-width='1.5'/></marker><marker id='m_green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#7AA116' stroke-width='1.5'/></marker><marker id='m_pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#E7157B' stroke-width='1.5'/></marker><marker id='m_purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#8C4FFF' stroke-width='1.5'/></marker><marker id='m_blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#147EBA' stroke-width='1.5'/></marker></defs><rect width='1100' height='470' fill='#ffffff'/><text x='250' y='40' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#232F3E' text-anchor='middle' font-weight='bold' font-style='normal'>Dockerfile.slow</text><rect x='40' y='70' width='330' height='42' rx='4' fill='#F2F3F3' stroke='#545B64' stroke-width='1.5'/><text x='54' y='96' font-family='Menlo, Consolas, monospace' font-size='13' fill='#232F3E' text-anchor='start' font-weight='normal' font-style='normal'>FROM node:24-alpine</text><text x='385' y='96' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#545B64' text-anchor='start' font-weight='bold' font-style='normal'>из кэша</text><rect x='40' y='122' width='330' height='42' rx='4' fill='#F2F3F3' stroke='#545B64' stroke-width='1.5'/><text x='54' y='148' font-family='Menlo, Consolas, monospace' font-size='13' fill='#232F3E' text-anchor='start' font-weight='normal' font-style='normal'>WORKDIR /app</text><text x='385' y='148' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#545B64' text-anchor='start' font-weight='bold' font-style='normal'>из кэша</text><rect x='40' y='174' width='330' height='42' rx='4' fill='#FDEBE7' stroke='#D13212' stroke-width='1.5'/><text x='54' y='200' font-family='Menlo, Consolas, monospace' font-size='13' fill='#232F3E' text-anchor='start' font-weight='normal' font-style='normal'>COPY . .</text><text x='385' y='200' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#D13212' text-anchor='start' font-weight='bold' font-style='normal'>изменился</text><rect x='40' y='226' width='330' height='42' rx='4' fill='#FDEBE7' stroke='#D13212' stroke-width='1.5'/><text x='54' y='252' font-family='Menlo, Consolas, monospace' font-size='13' fill='#232F3E' text-anchor='start' font-weight='normal' font-style='normal'>RUN npm ci --omit=dev</text><text x='385' y='252' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#D13212' text-anchor='start' font-weight='bold' font-style='normal'>пересобирается</text><text x='810' y='40' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#232F3E' text-anchor='middle' font-weight='bold' font-style='normal'>Dockerfile</text><rect x='600' y='70' width='330' height='42' rx='4' fill='#F2F3F3' stroke='#545B64' stroke-width='1.5'/><text x='614' y='96' font-family='Menlo, Consolas, monospace' font-size='13' fill='#232F3E' text-anchor='start' font-weight='normal' font-style='normal'>FROM node:24-alpine</text><text x='945' y='96' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#545B64' text-anchor='start' font-weight='bold' font-style='normal'>из кэша</text><rect x='600' y='122' width='330' height='42' rx='4' fill='#F2F3F3' stroke='#545B64' stroke-width='1.5'/><text x='614' y='148' font-family='Menlo, Consolas, monospace' font-size='13' fill='#232F3E' text-anchor='start' font-weight='normal' font-style='normal'>WORKDIR /app</text><text x='945' y='148' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#545B64' text-anchor='start' font-weight='bold' font-style='normal'>из кэша</text><rect x='600' y='174' width='330' height='42' rx='4' fill='#F2F3F3' stroke='#545B64' stroke-width='1.5'/><text x='614' y='200' font-family='Menlo, Consolas, monospace' font-size='13' fill='#232F3E' text-anchor='start' font-weight='normal' font-style='normal'>COPY package*.json ./</text><text x='945' y='200' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#545B64' text-anchor='start' font-weight='bold' font-style='normal'>из кэша</text><rect x='600' y='226' width='330' height='42' rx='4' fill='#F2F3F3' stroke='#545B64' stroke-width='1.5'/><text x='614' y='252' font-family='Menlo, Consolas, monospace' font-size='13' fill='#232F3E' text-anchor='start' font-weight='normal' font-style='normal'>RUN npm ci --omit=dev</text><text x='945' y='252' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#545B64' text-anchor='start' font-weight='bold' font-style='normal'>из кэша</text><rect x='600' y='278' width='330' height='42' rx='4' fill='#FDEBE7' stroke='#D13212' stroke-width='1.5'/><text x='614' y='304' font-family='Menlo, Consolas, monospace' font-size='13' fill='#232F3E' text-anchor='start' font-weight='normal' font-style='normal'>COPY . .</text><text x='945' y='304' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#D13212' text-anchor='start' font-weight='bold' font-style='normal'>изменился</text><text x='225' y='330' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#545B64' text-anchor='middle' font-weight='normal' font-style='normal'>Правка server.js меняет слой COPY . .,</text><text x='225' y='350' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#545B64' text-anchor='middle' font-weight='normal' font-style='normal'>и npm ci под ним выполняется заново</text><text x='785' y='390' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#545B64' text-anchor='middle' font-weight='normal' font-style='normal'>Зависимости установлены до копирования кода:</text><text x='785' y='410' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#545B64' text-anchor='middle' font-weight='normal' font-style='normal'>после правки server.js выполняется только COPY . .</text><line x1='20' y1='70' x2='20' y2='270' stroke='#545B64' stroke-width='1.5' marker-end='url(#m_grey)'/><text x='15' y='290' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#545B64' text-anchor='start' font-weight='normal' font-style='normal'>порядок</text><text x='550' y='450' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#545B64' text-anchor='middle' font-weight='normal' font-style='italic'>Слой пересобирается, если изменилась его инструкция или её файлы, и тогда пересобираются все слои после него</text></svg>