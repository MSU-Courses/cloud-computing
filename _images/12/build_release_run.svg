<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 470' width='1100' height='470' role='img' aria-label='Build, release, run: one artifact combined with two configurations into numbered releases for test and production, each run as processes'><defs><marker id='m_ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#232F3E' stroke-width='1.5'/></marker><marker id='m_grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#545B64' stroke-width='1.5'/></marker><marker id='m_orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#ED7100' stroke-width='1.5'/></marker><marker id='m_red' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#D13212' stroke-width='1.5'/></marker><marker id='m_teal' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#00A4A6' stroke-width='1.5'/></marker><marker id='m_green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#7AA116' stroke-width='1.5'/></marker><marker id='m_pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#E7157B' stroke-width='1.5'/></marker><marker id='m_purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#8C4FFF' stroke-width='1.5'/></marker><marker id='m_blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#147EBA' stroke-width='1.5'/></marker></defs><rect width='1100' height='470' fill='#ffffff'/><text x='150' y='40' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#7AA116' text-anchor='middle' font-weight='bold' font-style='normal'>Сборка (build)</text><text x='550' y='40' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#8C4FFF' text-anchor='middle' font-weight='bold' font-style='normal'>Выпуск (release)</text><text x='950' y='40' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#ED7100' text-anchor='middle' font-weight='bold' font-style='normal'>Запуск (run)</text><image href='data:image/svg+xml;base64,' x='40' y='170' width='44' height='44'/><text x='62' y='232' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#545B64' text-anchor='middle' font-weight='normal' font-style='normal'>код</text><line x1='90' y1='192' x2='150' y2='192' stroke='#7AA116' stroke-width='1.5' marker-end='url(#m_green)'/><rect x='155' y='150' width='150' height='90' rx='6' fill='#F3F8E8' stroke='#7AA116' stroke-width='1.5'/><text x='230' y='180' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#232F3E' text-anchor='middle' font-weight='bold' font-style='normal'>артефакт</text><text x='230' y='202' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#545B64' text-anchor='middle' font-weight='normal' font-style='normal'>образ</text><text x='230' y='222' font-family='Menlo, Consolas, monospace' font-size='12' fill='#232F3E' text-anchor='middle' font-weight='normal' font-style='normal'>catalog:1.4.0</text><rect x='400' y='90' width='300' height='120' rx='6' fill='#F4EEFF' stroke='#8C4FFF' stroke-width='1.5'/><image href='data:image/svg+xml;base64,' x='414' y='104' width='36' height='36'/><text x='460' y='120' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#232F3E' text-anchor='start' font-weight='bold' font-style='normal'>Выпуск 7</text>