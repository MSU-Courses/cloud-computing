<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 460' width='1100' height='460' role='img' aria-label='Envelope encryption: KMS key encrypts the data key, data key encrypts the data'><defs><marker id='m_ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#232F3E' stroke-width='1.5'/></marker><marker id='m_grey' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#545B64' stroke-width='1.5'/></marker><marker id='m_orange' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#ED7100' stroke-width='1.5'/></marker><marker id='m_red' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#DD344C' stroke-width='1.5'/></marker><marker id='m_pink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#E7157B' stroke-width='1.5'/></marker><marker id='m_green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#7AA116' stroke-width='1.5'/></marker><marker id='m_blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#147EBA' stroke-width='1.5'/></marker><marker id='m_purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#8C4FFF' stroke-width='1.5'/></marker></defs><rect width='1100' height='460' fill='#ffffff'/><rect x='40' y='60' width='250' height='300' rx='6' fill='#FFFFFF' stroke='#DD344C' stroke-width='1.5'/><rect x='145' y='80' width='40' height='40' fill='#DD344C'/><circle cx='159.0' cy='100.0' r='6.0' fill='none' stroke='#FFFFFF' stroke-width='2'/><path d='M165.0,100.0 L177.0,100.0 M173.0,100.0 L173.0,105.0 M177.0,100.0 L177.0,104.0' fill='none' stroke='#FFFFFF' stroke-width='2'/><text x='165' y='144.9' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#232F3E' text-anchor='middle' font-weight='bold' font-style='normal'>AWS KMS</text><rect x='70' y='180' width='190' height='60' rx='4' fill='#FDECEF' stroke='#DD344C' stroke-width='1.5'/><text x='165.0' y='206.1' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#232F3E' text-anchor='middle' font-weight='bold' font-style='normal'>Ключ KMS</text><text x='165.0' y='223.0' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#232F3E' text-anchor='middle' font-weight='bold' font-style='normal'>не покидает KMS</text><text x='165' y='296.4' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#545B64' text-anchor='middle' font-weight='normal' font-style='normal'>шифрует и расшифровывает</text><text x='165' y='312.0' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#545B64' text-anchor='middle' font-weight='normal' font-style='normal'>только ключи данных</text><rect x='400' y='60' width='300' height='300' rx='6' fill='#FFFFFF' stroke='#545B64' stroke-width='1.5'/><text x='550' y='88.9' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#232F3E' text-anchor='middle' font-weight='bold' font-style='normal'>Сервис хранения (S3, EBS, RDS)</text><rect x='430' y='120' width='240' height='46' rx='4' fill='#F1F7E6' stroke='#7AA116' stroke-width='1.5'/><text x='550.0' y='147.6' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#232F3E' text-anchor='middle' font-weight='normal' font-style='normal'>Ключ данных (открытый)</text><rect x='430' y='196' width='240' height='46' rx='4' fill='#F2F3F3' stroke='#545B64' stroke-width='1.5'/><text x='550.0' y='223.6' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#232F3E' text-anchor='middle' font-weight='normal' font-style='normal'>Данные: открытый текст</text><text x='550' y='296.4' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#545B64' text-anchor='middle' font-weight='normal' font-style='normal'>открытый ключ данных удаляется</text><text x='550' y='312.0' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#545B64' text-anchor='middle' font-weight='normal' font-style='normal'>сразу после шифрования</text><rect x='800' y='60' width='260' height='300' rx='6' fill='#FFFFFF' stroke='#ED7100' stroke-width='1.5'/><text x='930' y='88.9' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#232F3E' text-anchor='middle' font-weight='bold' font-style='normal'>Хранилище</text><rect x='825' y='150' width='210' height='60' rx='4' fill='#FFF1E5' stroke='#ED7100' stroke-width='1.5'/><text x='930.0' y='184.6' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#232F3E' text-anchor='middle' font-weight='normal' font-style='normal'>Зашифрованные данные</text><rect x='825' y='230' width='210' height='60' rx='4' fill='#FDECEF' stroke='#DD344C' stroke-width='1.5'/><text x='930.0' y='256.1' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#232F3E' text-anchor='middle' font-weight='normal' font-style='normal'>Зашифрованный</text><text x='930.0' y='273.0' font-family='Arial, Helvetica, sans-serif' font-size='13' fill='#232F3E' text-anchor='middle' font-weight='normal' font-style='normal'>ключ данных</text><text x='930' y='316.4' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#545B64' text-anchor='middle' font-weight='normal' font-style='normal'>лежат рядом, без KMS</text><text x='930' y='332.0' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#545B64' text-anchor='middle' font-weight='normal' font-style='normal'>ключ не расшифровать</text><path d='M290,143 L426,143' fill='none' stroke='#DD344C' stroke-width='1.5' marker-end='url(#m_red)' marker-start='url(#m_red)'/><circle cx='358' cy='120' r='11' fill='#DD344C'/><text x='358' y='124.2' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#FFFFFF' text-anchor='middle' font-weight='bold' font-style='normal'>1</text><text x='358' y='168.4' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#232F3E' text-anchor='middle' font-weight='normal' font-style='normal'>создать ключ</text><text x='358' y='184.0' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#232F3E' text-anchor='middle' font-weight='normal' font-style='normal'>данных</text><path d='M550,166 L550,192' fill='none' stroke='#7AA116' stroke-width='1.5' marker-end='url(#m_green)'/><circle cx='745' cy='205' r='11' fill='#ED7100'/><text x='745' y='209.2' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#FFFFFF' text-anchor='middle' font-weight='bold' font-style='normal'>2</text><path d='M670,219 L821,180' fill='none' stroke='#ED7100' stroke-width='1.5' marker-end='url(#m_orange)'/><text x='745' y='176.2' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#ED7100' text-anchor='middle' font-weight='normal' font-style='normal'>шифрование</text><path d='M290,260 L821,260' fill='none' stroke='#DD344C' stroke-width='1.5' stroke-dasharray='5 4' marker-end='url(#m_red)'/><circle cx='560' cy='260' r='11' fill='#DD344C'/><text x='560' y='264.2' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#FFFFFF' text-anchor='middle' font-weight='bold' font-style='normal'>3</text><text x='560' y='340.2' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#232F3E' text-anchor='middle' font-weight='normal' font-style='normal'></text><text x='560' y='399.2' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#232F3E' text-anchor='middle' font-weight='normal' font-style='normal'>1. KMS возвращает ключ данных в двух видах: открытом и зашифрованном ключом KMS.   2. Сервис шифрует данные открытым ключом.</text><text x='560' y='422.2' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#232F3E' text-anchor='middle' font-weight='normal' font-style='normal'>3. Зашифрованный ключ сохраняется рядом с данными. При чтении в KMS отправляют только его и получают открытый ключ данных.</text></svg>